<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strange World | Shadow Hope</title>
    
    <link rel="icon" type="image/png" href="https://i.ibb.co/DPmtLPMj/Icon.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@300;400;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --orange: #ff4500;
            --cyan: #00e5ff;
            --dark: #020202;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            overflow-x: hidden;
        }

        /* --- BACKGROUND CANVAS --- */
        #hero-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.2;
        }

        /* --- NAVIGATION --- */
        header {
            padding: 20px 8%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.95); border-bottom: 4px solid var(--orange);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-text {
            font-family: 'Lilita One', cursive; font-size: 2rem;
            text-shadow: 3px 3px 0 var(--orange); letter-spacing: 2px;
        }

        nav a {
            font-family: 'Lilita One', cursive; color: #fff; text-decoration: none;
            margin-left: 25px; font-size: 1.1rem; text-transform: uppercase; transition: 0.3s;
        }
        nav a:hover, .active { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

        /* --- HERO SECTION --- */
        .hero {
            height: 90vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 10%;
        }

        .hero h1 {
            font-family: 'Lilita One', cursive; font-size: clamp(4rem, 15vw, 8rem);
            line-height: 0.9; text-shadow: 8px 8px 0 var(--orange);
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem; color: var(--cyan); font-weight: 900;
            letter-spacing: 5px; text-transform: uppercase;
        }

        /* --- MAIN BUTTONS --- */
        .btn-container { margin-top: 50px; display: flex; gap: 20px; }

        .main-btn {
            padding: 15px 40px; font-family: 'Lilita One'; font-size: 1.5rem;
            text-decoration: none; color: white; border-radius: 10px;
            transition: 0.2s; position: relative; overflow: hidden;
        }

        .play-btn { background: var(--orange); box-shadow: 0 6px 0 #9e2b00; }
        .play-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #9e2b00; }
        .play-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9e2b00; }

        footer {
            padding: 40px; text-align: center; font-family: 'Lilita One';
            color: #111; letter-spacing: 10px; font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <canvas id="hero-canvas"></canvas>

    <header>
        <div class="logo-text">STRANGE WORLD</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="AboutUs.html">About Us</a>
            <a href="Community.html">Community</a>
            <a href="Store.html">Store</a>
        </nav>
    </header>

    <main class="hero">
        <p>A CYBER-HORROR EXPERIENCE</p>
        <h1>SHADOW<br>HOPE</h1>
        
        <div class="btn-container">
            <a href="Store.html" class="main-btn play-btn">GET THE GAME</a>
        </div>
    </main>

    <footer>STRANGE WORLD // 2026</footer>

    <script>
        const canvas = document.getElementById('hero-canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawGrid() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ff4500';
            ctx.lineWidth = 0.5;

            for(let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            requestAnimationFrame(drawGrid);
        }
        drawGrid();
    </script>
</body>
</html>
