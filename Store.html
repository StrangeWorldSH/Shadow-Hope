<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strange World | Identity & Store</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/DPmtLPMj/Icon.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@300;400;900&display=swap" rel="stylesheet">
    
    <!-- Auth Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { 
            --orange: #ff4500; 
            --cyan: #00e5ff; 
            --dark: #020202; 
            --gray: #111; 
        }

        /* --- BASE & UI --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { 
            background-color: var(--dark); 
            color: #fff; 
            font-family: 'Rubik', sans-serif; 
            overflow-x: hidden; 
        }

        /* --- AUTH SYSTEM --- */
        #auth-system {
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.98);
            z-index: 9999; 
            display: flex; justify-content: center; align-items: center;
        }
        .auth-card { 
            width: 90%; max-width: 440px; 
            padding: 40px; background: #080808; 
            border: 2px solid var(--orange); border-radius: 35px; 
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.2);
        }
        .hidden { display: none !important; }
        
        input { 
            width: 100%; padding: 15px; margin: 10px 0; background: var(--gray); 
            border: 1px solid #333; color: white; border-radius: 12px; 
            outline: none; text-align: center; font-family: 'Rubik';
            transition: 0.3s;
        }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

        .btn-action { 
            width: 100%; padding: 16px; background: var(--orange); border: none; 
            color: white; font-family: 'Lilita One'; font-size: 1.5rem; 
            border-radius: 12px; transition: 0.3s; margin-top: 10px; cursor: pointer; 
        }
        .btn-action:hover { transform: scale(1.02); filter: brightness(1.2); }
        
        .link-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .link { color: var(--cyan); cursor: pointer; font-size: 0.9rem; text-decoration: none; font-family: 'Lilita One'; letter-spacing: 1px; }
        .link:hover { text-decoration: underline; }

        /* --- KEBAB MENU (Navigation) --- */
        .kebab-menu { position: relative; cursor: pointer; padding: 10px; z-index: 2000; }
        .kebab-dot { width: 5px; height: 5px; background: white; border-radius: 50%; margin: 4px 0; }
        .dropdown { 
            position: absolute; right: 0; top: 60px; background: #050505; 
            border: 2px solid var(--orange); border-radius: 15px; width: 220px; 
            display: none; overflow: hidden;
            box-shadow: -10px 10px 30px rgba(0,0,0,0.8);
        }
        .dropdown a { 
            display: block; padding: 15px 20px; 
            font-family: 'Lilita One'; color: #eee; 
            text-decoration: none; transition: 0.2s;
            border-bottom: 1px solid #111;
        }
        .dropdown a:hover { background: var(--orange); color: white; padding-left: 30px; }

        /* --- MAIN VAULT UI --- */
        #vault-ui { 
            opacity: 0; visibility: hidden; 
            transition: 1.5s cubic-bezier(0.19, 1, 0.22, 1); 
            padding: 30px 8%; 
            min-height: 100vh;
        }
        #vault-ui.unlocked { opacity: 1; visibility: visible; }

        .store-header {
            display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 50px;
            border-bottom: 2px solid #222; padding-bottom: 20px;
        }

        /* Scanlines Effect */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 10000; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SYSTEM -->
    <div id="auth-system">
        <div id="view-start" class="auth-card">
            <h1 style="font-family:'Lilita One'; font-size: 3.5rem; color: var(--orange); margin-bottom: 10px;">IDENTITY</h1>
            <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem;">VERIFY YOUR STATUS TO ACCESS THE STORE</p>
            
            <input type="text" id="id-input" placeholder="Username or Email">
            <button class="btn-action" onclick="checkUserExists()">CONTINUE</button>
            
            <p style="margin: 20px 0; color: #444; font-size: 0.8rem;">SECURE GOOGLE ACCESS</p>
            <div id="g_id_onload" data-client_id="976725715682-qn73g5lfndmj0uvgboq5t75kfgchqn9u.apps.googleusercontent.com" data-callback="handleGoogle"></div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-width="360"></div>
            
            <div class="link-container">
                <span class="link" onclick="switchView('view-reg')">REGISTER</span>
                <span class="link" style="color: #666;" onclick="switchView('view-recover')">FORGOT?</span>
            </div>
        </div>

        <div id="view-pass" class="auth-card hidden">
            <h2 style="font-family:'Lilita One'; color: var(--cyan); margin-bottom: 10px;">ACCESS KEY</h2>
            <p id="target-display" style="color: #ff4500; margin-bottom: 15px; font-weight: bold;"></p>
            <input type="password" id="pass-field" placeholder="Enter Password">
            <button class="btn-action" onclick="validatePassword()">VERIFY</button>
            <div class="link-container">
                <span class="link" onclick="switchView('view-start')">BACK</span>
            </div>
        </div>

        <div id="view-reg" class="auth-card hidden">
            <h2 style="font-family:'Lilita One'; margin-bottom: 20px;">NEW SURVIVOR</h2>
            <div id="reg-form">
                <input type="text" id="reg-user" placeholder="Create Username">
                <input type="email" id="reg-mail" placeholder="Your Email">
                <input type="password" id="reg-pass" placeholder="Create Password">
                <button class="btn-action" id="btn-send-reg" onclick="sendAuthEmail('reg-mail', 'Registration', 'reg-verify', 'btn-send-reg')">SEND CODE</button>
            </div>
            <div id="reg-verify" class="hidden">
                <input type="text" id="reg-otp" placeholder="000000" maxlength="6">
                <button class="btn-action" onclick="verifyAndSaveUser()">FINISH REGISTRATION</button>
            </div>
            <span class="link" style="display:block; margin-top:20px;" onclick="switchView('view-start')">CANCEL</span>
        </div>

        <div id="view-recover" class="auth-card hidden">
            <h2 style="font-family:'Lilita One'; color: var(--orange); margin-bottom: 20px;">RECOVERY</h2>
            <input type="email" id="rec-mail" placeholder="Registered Email">
            <button class="btn-action" id="btn-send-rec" onclick="sendAuthEmail('rec-mail', 'Recovery', 'rec-verify', 'btn-send-rec')">SEND CODE</button>
            
            <div id="rec-verify" class="hidden">
                <input type="text" id="rec-otp" placeholder="Enter Code" maxlength="6">
                <input type="password" id="new-pass" placeholder="New Password">
                <button class="btn-action" onclick="updatePassword()">RESET PASSWORD</button>
            </div>
            <span class="link" style="display:block; margin-top:20px;" onclick="switchView('view-start')">RETURN</span>
        </div>
    </div>

    <!-- MAIN STORE INTERFACE -->
    <main id="vault-ui">
        <header class="store-header">
            <h1 style="font-family:'Lilita One'; color:var(--orange); font-size: 2.5rem; text-shadow: 3px 3px 0 #000;">THE VAULT</h1>
            
            <div style="display:flex; align-items:center; gap:20px;">
                <div style="text-align: right;">
                    <p style="font-size: 0.7rem; color: #555; margin-bottom: -5px;">LOGGED AS</p>
                    <span id="user-display" style="font-family:'Lilita One'; color: var(--cyan); font-size: 1.2rem;"></span>
                </div>
                
                <div class="kebab-menu" onclick="toggleKebab(event)">
                    <div class="kebab-dot"></div><div class="kebab-dot"></div><div class="kebab-dot"></div>
                    <div id="kebab-dropdown" class="dropdown">
                        <!-- Enlaces corregidos para coincidir con tu estructura de carpetas -->
                        <a href="../index.html">HOME</a>
                        <a href="../AboutUs.html">ABOUT US</a>
                        <a href="../Community.html">COMMUNITY</a>
                        <a href="Store.html" style="color:var(--cyan)">STORE</a>
                        <div style="padding:15px; color:red; font-family:'Lilita One'; cursor:pointer; border-top: 1px solid #222;" onclick="location.reload()">LOGOUT</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- STORE CONTENT GRID (Ejemplo) -->
        <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px;">
            <div style="background: var(--gray); padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center;">
                <div style="width: 100%; height: 200px; background: #050505; border-radius: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center;">
                    <img src="https://i.ibb.co/DPmtLPMj/Icon.png" style="width: 80px; opacity: 0.2;" alt="Coming Soon">
                </div>
                <h3 style="font-family: 'Lilita One'; margin-bottom: 10px;">SHADOW HOPE (PRE-ORDER)</h3>
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">Secure your copy of the first chapter of the saga.</p>
                <button class="btn-action" style="font-size: 1rem; padding: 10px;">COMING SOON</button>
            </div>
            <!-- Puedes añadir más tarjetas aquí -->
        </section>
    </main>

    <script>
        // Initialize EmailJS
        (function() { emailjs.init("3XgvL4XF6IdEb6r-W"); })();

        let generatedOTP = null;
        let currentUserData = null;

        function switchView(id) {
            document.querySelectorAll('.auth-card').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function toggleKebab(e) {
            e.stopPropagation();
            const d = document.getElementById('kebab-dropdown');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = () => document.getElementById('kebab-dropdown').style.display = "none";

        function sendAuthEmail(emailId, type, verifyDivId, btnId) {
            const email = document.getElementById(emailId).value;
            if(!email.includes('@')) return alert("Please enter a valid email address.");
            
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById(btnId).innerText = "SENDING...";

            emailjs.send("service_n5upbn5", "template_9zecuia", {
                to_email: email, 
                message_type: type, 
                verification_code: generatedOTP
            }).then(() => {
                document.getElementById(verifyDivId).classList.remove('hidden');
                document.getElementById(btnId).classList.add('hidden');
            }).catch(err => {
                alert("Email failed to send. Check console.");
                document.getElementById(btnId).innerText = "RETRY";
            });
        }

        function verifyAndSaveUser() {
            const otp = document.getElementById('reg-otp').value;
            const user = document.getElementById('reg-user').value;
            const pass = document.getElementById('reg-pass').value;
            const mail = document.getElementById('reg-mail').value.toLowerCase();
            
            if(otp !== generatedOTP) return alert("Invalid Verification Code.");
            if(user.length < 3 || pass.length < 4) return alert("Username or Password too short.");
            
            const data = { user, pass, mail };
            localStorage.setItem('user_' + user.toLowerCase(), JSON.stringify(data));
            localStorage.setItem('user_' + mail, JSON.stringify(data));
            unlockVault(user);
        }

        function checkUserExists() {
            const id = document.getElementById('id-input').value.toLowerCase().trim();
            if(!id) return alert("Enter your identity.");
            
            const stored = localStorage.getItem('user_' + id);
            if(!stored) return alert("Identity not found. Please Register first.");
            
            currentUserData = JSON.parse(stored);
            document.getElementById('target-display').innerText = id.toUpperCase();
            switchView('view-pass');
        }

        function validatePassword() {
            if(document.getElementById('pass-field').value === currentUserData.pass) {
                unlockVault(currentUserData.user);
            } else {
                alert("ACCESS DENIED: Incorrect Key.");
            }
        }

        function updatePassword() {
            if(document.getElementById('rec-otp').value !== generatedOTP) return alert("Invalid Code.");
            const mail = document.getElementById('rec-mail').value.toLowerCase();
            const stored = localStorage.getItem('user_' + mail);
            
            if(!stored) return alert("Email not found.");
            
            let data = JSON.parse(stored);
            data.pass = document.getElementById('new-pass').value;
            localStorage.setItem('user_' + data.user.toLowerCase(), JSON.stringify(data));
            localStorage.setItem('user_' + mail, JSON.stringify(data));
            
            alert("SUCCESS: Key has been reset.");
            location.reload();
        }

        function unlockVault(name) {
            document.getElementById('auth-system').style.transition = '0.5s';
            document.getElementById('auth-system').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-system').style.display = 'none';
                document.getElementById('vault-ui').classList.add('unlocked');
                document.getElementById('user-display').innerText = name.toUpperCase();
            }, 500);
        }

        function handleGoogle(resp) {
            const data = JSON.parse(atob(resp.credential.split('.')[1]));
            unlockVault(data.given_name || "SURVIVOR");
        }
    </script>
</body>
</html>
