<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Community Hub | Strange World</title>
    
    <link rel="icon" type="image/png" href="https://i.ibb.co/DPmtLPMj/Icon.png">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --orange: #ff4500;
            --cyan: #00e5ff;
            --dark: #020202;
            --panel: rgba(15, 15, 15, 0.95);
            --input-bg: #111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            overflow-x: hidden;
        }

        /* --- FONDO DE GLITCH DINÁMICO --- */
        #glitch-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.15;
        }

        /* --- NAVEGACIÓN --- */
        header {
            padding: 25px 8%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.98); border-bottom: 5px solid var(--orange);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-text { font-family: 'Lilita One', cursive; font-size: 2rem; text-shadow: 3px 3px 0 var(--orange); }

        nav a {
            font-family: 'Lilita One', cursive; color: #fff; text-decoration: none;
            margin-left: 25px; font-size: 1.1rem; text-transform: uppercase; transition: 0.3s;
        }
        nav a:hover, .active { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

        /* --- CONTENIDO --- */
        .container { padding: 60px 8%; max-width: 1400px; margin: 0 auto; position: relative; z-index: 10; }

        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h1 { font-family: 'Lilita One', cursive; font-size: clamp(3rem, 8vw, 5rem); text-shadow: 6px 6px 0 var(--orange); }

        /* --- GRID DE REDES SOCIALES --- */
        .social-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 80px;
        }

        .social-btn {
            background: var(--panel); border: 2px solid #222;
            padding: 30px 15px; border-radius: 20px; text-align: center;
            text-decoration: none; color: white; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .social-btn:hover {
            transform: translateY(-8px); border-color: var(--cyan);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1);
        }

        .social-btn i { font-size: 2.5rem; color: var(--orange); }
        .social-btn span { font-family: 'Lilita One', cursive; font-size: 1.2rem; letter-spacing: 1px; }

        /* --- SECCIÓN DE COMENTARIOS --- */
        .comments-section {
            background: var(--panel); border: 2px solid #333;
            padding: 50px; border-radius: 40px; margin-top: 50px;
        }

        .comments-section h2 { font-family: 'Lilita One', cursive; font-size: 2.5rem; margin-bottom: 30px; color: var(--cyan); }

        .comment-form { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        
        .comment-form input, .comment-form textarea {
            background: var(--input-bg); border: 2px solid #333;
            padding: 20px; border-radius: 15px; color: white;
            font-family: 'Rubik', sans-serif; font-size: 1.1rem;
            outline: none; transition: 0.3s;
        }

        .comment-form input:focus, .comment-form textarea:focus { border-color: var(--orange); }

        .submit-btn {
            background: var(--orange); color: white; border: none;
            padding: 15px 40px; border-radius: 12px; font-family: 'Lilita One', cursive;
            font-size: 1.4rem; cursor: pointer; align-self: flex-start;
            transition: 0.2s; box-shadow: 0 5px 0 #9e2b00;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #9e2b00; }
        .submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9e2b00; }

        /* Lista de comentarios (Placeholder para el futuro) */
        .comment-list { border-top: 1px solid #333; padding-top: 30px; }
        .comment-item { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #222; }
        .comment-item strong { color: var(--orange); font-size: 1.1rem; }
        .comment-item p { color: #888; margin-top: 5px; }

        footer { padding: 60px; text-align: center; font-family: 'Lilita One'; color: #222; letter-spacing: 5px; }

        audio { display: none; }
    </style>
</head>
<body>

    <audio id="sfx_select"><source src="select" type="audio/mpeg"></audio>
    <audio id="sfx_press"><source src="press" type="audio/mpeg"></audio>

    <canvas id="glitch-canvas"></canvas>

    <header>
        <div class="logo-text">STRANGE WORLD</div>
        <nav>
            <a href="index.html" class="sfx-hover">Home</a>
            <a href="about.html" class="sfx-hover">About Us</a>
            <a href="community.html" class="active sfx-hover">Community</a>
            <a href="store.html" class="sfx-hover">Store</a>
        </nav>
    </header>

    <main class="container">
        <section class="section-header">
            <h1>COMMUNITY HUB</h1>
            <p style="color: #666; font-weight: bold; letter-spacing: 2px;">JOIN THE NETWORK</p>
        </section>

        <!-- Todas las Redes Sociales Reales -->
        <div class="social-grid">
            <a href="https://discord.gg/3hxGxnva" target="_blank" class="social-btn sfx-hover sfx-press">
                <i class="fab fa-discord"></i>
                <span>DISCORD</span>
            </a>
            <a href="https://whatsapp.com/channel/0029VbC8yGp90x2mdvk8LQ0M" target="_blank" class="social-btn sfx-hover sfx-press">
                <i class="fab fa-whatsapp"></i>
                <span>WHATSAPP</span>
            </a>
            <a href="https://www.youtube.com/@StrangeWorldSH" target="_blank" class="social-btn sfx-hover sfx-press">
                <i class="fab fa-youtube"></i>
                <span>YOUTUBE</span>
            </a>
            <a href="https://x.com/StrangeWorldSH" target="_blank" class="social-btn sfx-hover sfx-press">
                <i class="fab fa-x-twitter"></i>
                <span>X / TWITTER</span>
            </a>
            <a href="https://www.instagram.com/shadowhopesh/" target="_blank" class="social-btn sfx-hover sfx-press">
                <i class="fab fa-instagram"></i>
                <span>INSTAGRAM</span>
            </a>
            <a href="https://www.tiktok.com/@strangeworldsh" target="_blank" class="social-btn sfx-hover sfx-press">
                <i class="fab fa-tiktok"></i>
                <span>TIKTOK</span>
            </a>
        </div>

        <!-- Sección de Comentarios Real -->
        <section class="comments-section">
            <h2>SURVIVOR FEEDBACK</h2>
            <form class="comment-form" id="commentForm">
                <input type="text" placeholder="Your Survivor Name..." required id="username">
                <textarea rows="4" placeholder="Write your message to the void..." required id="message"></textarea>
                <button type="submit" class="submit-btn sfx-press">POST LOG</button>
            </form>

            <div class="comment-list" id="commentList">
                <div class="comment-item">
                    <strong>Strange World Dev</strong>
                    <p>Welcome to the official hub. Leave your theories and feedback below!</p>
                </div>
                <!-- Aquí aparecerán los nuevos comentarios -->
            </div>
        </section>
    </main>

    <footer>STRANGE WORLD // 2026 // ESTABLISHING CONNECTION</footer>

    <script>
        // --- GLITCH CANVAS BACKGROUND ---
        const canvas = document.getElementById('glitch-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawGlitch() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if(Math.random() > 0.9) {
                ctx.strokeStyle = Math.random() > 0.5 ? '#ff4500' : '#00e5ff';
                ctx.lineWidth = Math.random() * 3;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            requestAnimationFrame(drawGlitch);
        }
        drawGlitch();

        // --- SISTEMA DE COMENTARIOS (SIMULADO) ---
        const form = document.getElementById('commentForm');
        const list = document.getElementById('commentList');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const msg = document.getElementById('message').value;

            const newComment = document.createElement('div');
            newComment.className = 'comment-item';
            newComment.innerHTML = `<strong>${user}</strong><p>${msg}</p>`;
            
            list.prepend(newComment);
            form.reset();
        });

        // --- AUDIO ---
        const sS = document.getElementById('sfx_select');
        const sP = document.getElementById('sfx_press');
        function p(a) { a.currentTime = 0; a.play().catch(()=>{}); }

        document.querySelectorAll('.sfx-hover').forEach(el => {
            el.addEventListener('mouseenter', () => p(sS));
        });
        document.querySelectorAll('.sfx-press').forEach(el => {
            el.addEventListener('mousedown', () => p(sP));
        });
    </script>
</body>
</html>
